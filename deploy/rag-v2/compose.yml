name: sotsiaalai-rag-v2
services:
  postgres:
    # Come back after a host reboot (the VPS is rebooted for platform updates).
    restart: unless-stopped
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: rag_v2_dev
      POSTGRES_DB: rag_v2_dev
      POSTGRES_PASSWORD: ${RAG_V2_PG_PASSWORD:?Run the local setup CLI}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_v2_dev -d rag_v2_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports: ["127.0.0.1:56333:6333"]
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_V2_QDRANT_KEY:?Run the local setup CLI}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: ["qdrant-data:/qdrant/storage"]
volumes:
  pg-data:
  qdrant-data:
