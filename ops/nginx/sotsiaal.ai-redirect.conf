# Keep this domain and certificate while old links and provider callbacks exist.
server {
    listen 80;
    server_name sotsiaal.ai www.sotsiaal.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://sotsiaal.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sotsiaal.ai www.sotsiaal.ai;
    ssl_certificate /etc/letsencrypt/live/sotsiaal.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sotsiaal.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Provider POST callbacks must reach the application without a redirect.
    location ~ ^/api/subscription/(webhook|callback)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 308 https://sotsiaal.pro$request_uri;
    }
}
