# Keep this domain and certificate while old links and provider callbacks exist.
server {
    listen 80;
    server_name sotsiaal.ai www.sotsiaal.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://sotsiaal.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sotsiaal.ai www.sotsiaal.ai;
    ssl_certificate /etc/letsencrypt/live/sotsiaal.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sotsiaal.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25M;
    # Existing tabs and offline field notes still belong to this origin.
    # Keep their APIs, field shell, worker and assets on the same origin.
    # This also keeps provider POST callbacks free of redirects.
    location ~ ^/(api/|valitoo(/|$)|_next/|sw\.js$|site\.webmanifest$|icons/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        return 308 https://sotsiaal.pro$request_uri;
    }
}
